<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地通讯翻译程序</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
  }
  body {
    overflow-x: hidden;
  }
  .page {
    width: 100vw;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: #000;
  }
  .poster {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
  @media (min-aspect-ratio: 1710/920) {
    .page {
      align-items: center;
    }
    .poster {
      width: auto;
      height: 100vh;
      max-width: 100vw;
      object-fit: contain;
    }
  }
</style>
</head>
<body>
  <main class="page">
    <img class="poster" src="assets/translation-poster.png" alt="本地通讯翻译程序">
  </main>
</body>
</html>
