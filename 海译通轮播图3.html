<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海译通版本升级</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:transparent;color:#17324a}
  body{overflow:auto}
  .upgrade{
    width:100vw;
    min-height:100vh;
    padding:clamp(12px,2.2vw,26px);
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(220px,26%);
    gap:clamp(12px,2vw,26px);
    align-items:stretch;
    background:#fff;
    border:1px solid #dbe7e2;
    border-radius:clamp(0px,1vw,12px);
  }
  .main{min-width:0;display:flex;flex-direction:column;justify-content:center}
  .title{display:flex;align-items:center;gap:clamp(8px,1vw,12px);margin-bottom:clamp(4px,.8vh,8px)}
  .logo{width:clamp(30px,3.4vw,40px);height:clamp(30px,3.4vw,40px);flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#24c56b,#0e9f5b);color:white;font-weight:800;font-size:clamp(15px,1.6vw,19px);box-shadow:0 6px 15px rgba(16,185,129,.22)}
  h1{margin:0;font-size:clamp(18px,2.2vw,28px);line-height:1.18;color:#16324a;white-space:normal}
  .sub{margin:2px 0 clamp(8px,1.5vh,14px) clamp(38px,4.5vw,52px);color:#6b7d8d;font-size:clamp(11px,1.1vw,14px)}
  .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(6px,1vh,10px) clamp(8px,1.2vw,14px);margin:0;padding:0;list-style:none}
  .list li{display:flex;align-items:center;gap:8px;min-height:clamp(32px,4.6vh,42px);padding:clamp(6px,.8vh,9px) clamp(8px,1vw,11px);border-radius:9px;background:#f7fbf9;border:1px solid #e5f1eb;font-size:clamp(11px,1.15vw,14px);line-height:1.25;color:#30485d;overflow-wrap:anywhere}
  .n{width:clamp(19px,2vw,23px);height:clamp(19px,2vw,23px);flex:0 0 auto;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#18b865;color:white;font-size:clamp(10px,.9vw,12px);font-weight:800}
  .side{display:flex;flex-direction:column;justify-content:center;align-items:stretch;min-width:0;padding:clamp(4px,.8vw,10px)}
  .version{font-size:clamp(10px,1vw,13px);color:#1a9a59;font-weight:700;margin-bottom:clamp(5px,1vh,10px)}
  .side h2{font-size:clamp(16px,1.8vw,22px);margin:0 0 clamp(5px,1vh,9px);color:#17324a;line-height:1.25}
  .side p{font-size:clamp(11px,1.05vw,13px);line-height:1.5;color:#6a7b89;margin:0 0 clamp(10px,1.7vh,18px)}
  .btn{display:flex;align-items:center;justify-content:center;min-height:clamp(40px,5.5vh,50px);padding:0 14px;border-radius:10px;text-decoration:none;background:linear-gradient(135deg,#24c56b,#109c5c);color:#fff;font-size:clamp(14px,1.45vw,18px);font-weight:800;box-shadow:0 10px 22px rgba(16,156,92,.25);transition:.18s ease}
  .btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(16,156,92,.32)}
  .note{margin-top:8px;font-size:clamp(9px,.9vw,11px);color:#91a0aa;text-align:center}

  /* 窗口变窄时自动改成单列 */
  @media (max-width:760px){
    .upgrade{grid-template-columns:1fr;min-height:100vh;gap:12px;align-content:start}
    .sub{margin-left:0}
    .side{padding:8px 0 0}
    .list{grid-template-columns:1fr}
  }

  /* 窗口高度很小时进一步压缩间距，避免按钮被挤出 */
  @media (max-height:360px) and (min-width:761px){
    .upgrade{padding:10px 14px;gap:14px}
    .title{margin-bottom:2px}
    .sub{margin-bottom:6px}
    .list{gap:5px 8px}
    .list li{min-height:30px;padding:5px 8px}
    .side p{margin-bottom:9px;line-height:1.35}
    .note{display:none}
  }
</style>
</head>
<body>
  <section class="upgrade">
    <div class="main">
      <div class="title">
        <div class="logo">译</div>
        <h1>海译通 本次版本升级说明</h1>
      </div>
      <div class="sub">新增平台支持 · 修复已知问题 · 提升整体使用体验</div>
      <ul class="list">
        <li><span class="n">1</span><span>新增 <b>Messenger</b> 平台</span></li>
        <li><span class="n">2</span><span>新增 <b>Instagram</b> 平台</span></li>
        <li><span class="n">3</span><span>新增 <b>Discord</b> 平台</span></li>
        <li><span class="n">4</span><span>修复会话窗口滚轮问题</span></li>
        <li><span class="n">5</span><span>修复 <b>WhatsApp</b> 左侧联系人卡片过大问题</span></li>
        <li><span class="n">6</span><span>修复启动页 LOGO 无法展示问题</span></li>
      </ul>
    </div>
    <aside class="side">
      <div class="version">VERSION UPDATE</div>
      <h2>立即升级到最新版本</h2>
      <p>升级后即可使用新增平台，并获得更稳定、顺畅的会话体验。</p>
      <a class="btn" href="https://zhongdongahe-boop.github.io/haiyitong/" target="_blank" rel="noopener noreferrer">立即升级</a>
      <div class="note">点击按钮前往升级页面</div>
    </aside>
  </section>
</body>
</html>
